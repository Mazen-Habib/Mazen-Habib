<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <!-- paper grain: fine speckle + soft fibres -->
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="fine"/>
      <feColorMatrix in="fine" type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.91  0 0 0 0 0.86  0 0 0 0.09 0" result="speck"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="2" seed="3" result="fib"/>
      <feColorMatrix in="fib" type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.91  0 0 0 0 0.86  0 0 0 0.07 0" result="fibres"/>
      <feMerge><feMergeNode in="fibres"/><feMergeNode in="speck"/></feMerge>
    </filter>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="400" rx="22"/></clipPath>

    <!-- typing masks for terminal lines (10s synced loop) -->
    <clipPath id="t1"><rect x="700" y="110" height="26" width="0"><animate attributeName="width" values="0;0;420;420;0" keyTimes="0;0.02;0.12;0.94;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t2"><rect x="700" y="136" height="26" width="0"><animate attributeName="width" values="0;0;420;420;0" keyTimes="0;0.14;0.16;0.94;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t3"><rect x="700" y="172" height="26" width="0"><animate attributeName="width" values="0;0;420;420;0" keyTimes="0;0.22;0.34;0.94;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t4"><rect x="700" y="198" height="26" width="0"><animate attributeName="width" values="0;0;420;420;0" keyTimes="0;0.36;0.38;0.94;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t5"><rect x="700" y="234" height="26" width="0"><animate attributeName="width" values="0;0;420;420;0" keyTimes="0;0.46;0.60;0.94;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t6"><rect x="700" y="260" height="26" width="0"><animate attributeName="width" values="0;0;420;420;0" keyTimes="0;0.66;0.70;0.94;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- black paper -->
    <rect width="1200" height="400" fill="#0A0A0A"/>
    <rect width="1200" height="400" filter="url(#paper)"/>
    <rect width="1200" height="400" fill="url(#vignette)"/>

    <!-- dashed constellation: straight off-white lines -->
    <g stroke="#EDE6D6" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="4 6" stroke-linecap="round" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="2.5s" repeatCount="indefinite"/>
      <line x1="70"  y1="92"  x2="186" y2="58"/>
      <line x1="70"  y1="92"  x2="150" y2="172"/>
      <line x1="186" y1="58"  x2="276" y2="128"/>
      <line x1="150" y1="172" x2="276" y2="128"/>
      <line x1="150" y1="172" x2="224" y2="282"/>
      <line x1="150" y1="172" x2="86"  y2="300"/>
      <line x1="86"  y1="300" x2="224" y2="282"/>
      <line x1="276" y1="128" x2="334" y2="232"/>
      <line x1="224" y1="282" x2="334" y2="232"/>
      <line x1="276" y1="128" x2="424" y2="86"/>
      <line x1="334" y1="232" x2="472" y2="192"/>
      <line x1="424" y1="86"  x2="472" y2="192"/>
      <line x1="424" y1="86"  x2="566" y2="128"/>
      <line x1="472" y1="192" x2="566" y2="128"/>
      <line x1="472" y1="192" x2="592" y2="272"/>
      <line x1="334" y1="232" x2="440" y2="334"/>
      <line x1="224" y1="282" x2="440" y2="334"/>
      <line x1="440" y1="334" x2="592" y2="272"/>
    </g>

    <!-- nodes -->
    <g fill="#EDE6D6">
      <circle cx="70"  cy="92"  r="3.5"><animate attributeName="opacity" values=".45;1;.45" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="186" cy="58"  r="3"><animate attributeName="opacity" values="1;.4;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="172" r="5"/>
      <circle cx="276" cy="128" r="4"><animate attributeName="opacity" values=".5;1;.5" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="86"  cy="300" r="3"/>
      <circle cx="224" cy="282" r="4"><animate attributeName="opacity" values="1;.45;1" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="334" cy="232" r="5.5"/>
      <circle cx="424" cy="86"  r="4"/>
      <circle cx="472" cy="192" r="5"><animate attributeName="opacity" values=".55;1;.55" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="566" cy="128" r="3"/>
      <circle cx="592" cy="272" r="4"><animate attributeName="opacity" values="1;.4;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="440" cy="334" r="3.5"/>
    </g>
    <!-- hub rings -->
    <g fill="none" stroke="#EDE6D6" stroke-opacity=".35">
      <circle cx="150" cy="172" r="11"/>
      <circle cx="334" cy="232" r="12"><animate attributeName="r" values="10;16;10" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".45;0;.45" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="472" cy="192" r="11"/>
    </g>

    <!-- signals travelling along the lines -->
    <circle r="3.2" fill="#FFFDF7" filter="url(#soft)">
      <animateMotion dur="6s" repeatCount="indefinite" path="M86 300 L150 172 L276 128 L424 86 L566 128 L472 192 L592 272"/>
    </circle>
    <circle r="2.6" fill="#FFFDF7" filter="url(#soft)" opacity=".8">
      <animateMotion dur="7s" begin="2s" repeatCount="indefinite" path="M70 92 L186 58 L276 128 L334 232 L440 334 L592 272"/>
    </circle>

    <!-- right: terminal -->
    <g>
      <rect x="680" y="62" width="470" height="276" rx="14" fill="#0B0F19" fill-opacity=".92" stroke="#EDE6D6" stroke-opacity=".22"/>
      <rect x="680" y="62" width="470" height="34" rx="14" fill="#161B22"/>
      <rect x="680" y="82" width="470" height="14" fill="#161B22"/>
      <circle cx="702" cy="79" r="6" fill="#FF5F57"/><circle cx="722" cy="79" r="6" fill="#FEBC2E"/><circle cx="742" cy="79" r="6" fill="#28C840"/>
      <text x="915" y="84" text-anchor="middle" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="12" fill="#8B949E">mazen@integcubes: ~</text>

      <g font-family="JetBrains Mono, SFMono-Regular, Consolas, Menlo, monospace" font-size="15">
        <text x="704" y="128" clip-path="url(#t1)"><tspan fill="#28C840">❯</tspan><tspan fill="#E6EDF3"> whoami</tspan></text>
        <text x="704" y="154" clip-path="url(#t2)" fill="#A78BFA">mazen — ai engineer, ex-designer</text>
        <text x="704" y="190" clip-path="url(#t3)"><tspan fill="#28C840">❯</tspan><tspan fill="#E6EDF3"> cat stack.txt</tspan></text>
        <text x="704" y="216" clip-path="url(#t4)" fill="#67E8F9">python · langchain · ollama · n8n</text>
        <text x="704" y="252" clip-path="url(#t5)"><tspan fill="#28C840">❯</tspan><tspan fill="#E6EDF3"> ./deploy --rag --local-gpu</tspan></text>
        <text x="704" y="278" clip-path="url(#t6)" fill="#F472B6">✓ 0 bytes left the network</text>
      </g>
      <rect x="704" y="296" width="9" height="18" fill="#22D3EE">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="22" fill="none" stroke="#EDE6D6" stroke-opacity=".18"/>
</svg>
