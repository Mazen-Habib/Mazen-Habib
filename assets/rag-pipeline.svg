<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" result="fine"/>
      <feColorMatrix in="fine" type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.91  0 0 0 0 0.86  0 0 0 0.09 0" result="speck"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="2" seed="5" result="fib"/>
      <feColorMatrix in="fib" type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.91  0 0 0 0 0.86  0 0 0 0.07 0" result="fibres"/>
      <feMerge><feMergeNode in="fibres"/><feMergeNode in="speck"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1000" height="230" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="230" fill="#0A0A0A"/>
    <rect width="1000" height="230" filter="url(#paper)"/>
  </g>
  <rect x=".5" y=".5" width="999" height="229" rx="18" fill="none" stroke="#EDE6D6" stroke-opacity=".18"/>

  <g font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="13">
    <text x="30" y="36" fill="#EDE6D6" fill-opacity=".55">~/local-rag-agent · pipeline.live</text>
    <circle cx="812" cy="32" r="4" fill="#EDE6D6"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="970" y="36" text-anchor="end" font-size="12" fill="#EDE6D6" fill-opacity=".85">ON-PREM · 0 EGRESS</text>
  </g>

  <!-- dashed wire -->
  <path d="M95 120 H905" stroke="#EDE6D6" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="4 6" stroke-linecap="round" fill="none">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.5s" repeatCount="indefinite"/>
  </path>

  <!-- packets -->
  <g fill="#FFFDF7" filter="url(#soft)">
    <circle r="3.5"><animateMotion dur="4s" repeatCount="indefinite" path="M95 120 H905"/></circle>
    <circle r="3.5"><animateMotion dur="4s" begin="1.33s" repeatCount="indefinite" path="M95 120 H905"/></circle>
    <circle r="3.5"><animateMotion dur="4s" begin="2.66s" repeatCount="indefinite" path="M95 120 H905"/></circle>
  </g>

  <!-- stages -->
  <g text-anchor="middle">
    <g fill="#0A0A0A" stroke="#EDE6D6" stroke-opacity=".55" stroke-width="1.2">
      <rect x="27"  y="88" width="136" height="64" rx="12"/>
      <rect x="189" y="88" width="136" height="64" rx="12"/>
      <rect x="351" y="88" width="136" height="64" rx="12"/>
      <rect x="513" y="88" width="136" height="64" rx="12"/>
      <rect x="675" y="88" width="136" height="64" rx="12" stroke-dasharray="4 4">
        <animate attributeName="stroke-opacity" values=".9;.3;.9" dur="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="837" y="88" width="136" height="64" rx="12"/>
    </g>
    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#F5F1E8">
      <text x="95" y="116">Documents</text><text x="257" y="116">OCR + Chunk</text><text x="419" y="116">Embeddings</text>
      <text x="581" y="116">Vector DB</text><text x="743" y="116">Local LLM</text><text x="905" y="116">Answer</text>
    </g>
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#EDE6D6" fill-opacity=".6">
      <text x="95" y="136">pdf · scans · mail</text><text x="257" y="136">nlp · clean · split</text><text x="419" y="136">vectorize</text>
      <text x="581" y="136">top-k retrieve</text><text x="743" y="136">ollama · gpu</text><text x="905" y="136">cited · private</text>
    </g>
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#EDE6D6" fill-opacity=".3">
      <text x="95" y="176">01</text><text x="257" y="176">02</text><text x="419" y="176">03</text>
      <text x="581" y="176">04</text><text x="743" y="176">05</text><text x="905" y="176">06</text>
    </g>
  </g>
  <text x="500" y="208" text-anchor="middle" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="12" fill="#EDE6D6" fill-opacity=".5">langchain orchestration  ·  python  ·  n8n triggers  ·  zero data leaves the building</text>
</svg>
